<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meal Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f4;
      color: #1f2922;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 70px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 44px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 750;
    }

    .subtitle {
      margin-top: 8px;
      color: #68736b;
      font-size: 17px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 9px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8ded9;
      border-radius: 12px;
      font-size: 16px;
      background: white;
      color: #1f2922;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .goal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .goal-option {
      border: 1px solid #d8ded9;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .goal-option:hover {
      border-color: #718a76;
    }

    .goal-option.selected {
      border-color: #42634b;
      background: #edf4ee;
      font-weight: 650;
    }

    .generate-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: #42634b;
      color: white;
      margin-top: 5px;
    }

    .generate-button:hover {
      background: #35523d;
    }

    .hidden {
      display: none;
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .plan-header h2 {
      margin: 0;
    }

    .new-plan-button {
      border: 1px solid #cbd5cd;
      background: white;
      color: #35523d;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-box {
      background: #edf4ee;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .summary-number {
      font-size: 23px;
      font-weight: 750;
    }

    .summary-label {
      color: #68736b;
      font-size: 13px;
      margin-top: 4px;
    }

    .day-card {
      border: 1px solid #e1e6e2;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
      background: white;
    }

    .day-header {
      padding: 16px 18px;
      background: #f1f5f1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-name {
      font-weight: 750;
      font-size: 18px;
    }

    .day-calories {
      color: #68736b;
      font-size: 14px;
    }

    .meal-list {
      padding: 6px 18px 14px;
    }

    .meal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0ed;
    }

    .meal-row:last-child {
      border-bottom: none;
    }

    .meal-type {
      color: #68736b;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .meal-name {
      font-weight: 700;
    }

    .meal-info {
      color: #68736b;
      font-size: 13px;
      margin-top: 3px;
    }

    .meal-button {
      flex-shrink: 0;
      border: 1px solid #ccd5ce;
      background: white;
      color: #35523d;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .meal-button:hover {
      background: #edf4ee;
    }

    .recipe-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .back-button {
      border: none;
      background: none;
      color: #42634b;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
    }

    .recipe-title {
      margin: 0;
      font-size: 28px;
    }

    .recipe-description {
      color: #68736b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .nutrition {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .nutrition span {
      background: #edf4ee;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .recipe-section {
      margin-top: 22px;
    }

    .recipe-section h3 {
      margin-bottom: 10px;
    }

    .recipe-section ul,
    .recipe-section ol {
      line-height: 1.7;
      padding-left: 22px;
    }

    .replace-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      background: #42634b;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
    }

    .grocery-button {
      width: 100%;
      border: 1px solid #42634b;
      border-radius: 12px;
      padding: 14px;
      background: white;
      color: #42634b;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .grocery-list {
      columns: 2;
      column-gap: 40px;
    }

    .grocery-category {
      break-inside: avoid;
      margin-bottom: 22px;
    }

    .grocery-category h3 {
      margin-bottom: 8px;
    }

    .grocery-category ul {
      padding-left: 20px;
      line-height: 1.7;
    }

    @media (max-width: 650px) {
      .app {
        padding: 22px 14px 50px;
      }

      h1 {
        font-size: 29px;
      }

      .goal-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .plan-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .meal-row {
        align-items: flex-start;
      }

      .grocery-list {
        columns: 1;
      }
    }
  </style>
</head>

<div class="app">

  <header class="header">
    <div class="logo">🥗</div>

    <h1>Weekly Meal Planner</h1>

    <div class="subtitle">

    </div>

  <!-- SETUP SCREEN -->

    <div class="card">

      <h2>Tell us about your week</h2>

      <div class="field">

        <label>Your goal</label>

        <div class="goal-grid">

          <div class="goal-option selected" data-goal="healthy">
            Eat Healthier
          </div>

          <div class="goal-option" data-goal="lose">
            Lose Weight
          </div>

          <div class="goal-option" data-goal="protein">
            High Protein
          </div>

          <div class="goal-option" data-goal="maintain">
            Maintain Weight
          </div>

        </div>

      </div>


      <div class="field">

        <label for="calories">
          Daily calorie target
        </label>

        <input
          type="number"
          id="calories"
          placeholder="Example: 1800"
          min="1000"
          max="5000"
        >

      </div>


      <div class="field">

        <label for="likes">
          Foods you like
        </label>

        <textarea
          id="likes"
          placeholder="Example: chicken, steak, rice, potatoes, Greek yogurt, eggs..."
        ></textarea>

      </div>


      <div class="field">

        <label for="dislikes">
          Foods you don't like
        </label>

        <textarea
          id="dislikes"
          placeholder="Example: fish, mushrooms, spicy food..."
        ></textarea>

      </div>


      <div class="field">

        <label for="difficulty">
          Cooking difficulty
        </label>

        <select id="difficulty">

          <option value="easy">
            Easy — quick and simple
          </option>

          <option value="moderate">
            Moderate — I don't mind cooking
          </option>

          <option value="advanced">
            Advanced — I enjoy cooking
          </option>

        </select>

      </div>


      <button
        class="generate-button"
        onclick="generatePlan()"
      >
        Generate My 7-Day Meal Plan
      </button>

    </div>

  </section>


  <!-- PLAN SCREEN -->

  <section id="planScreen" class="hidden">

    <div class="card">

      <div class="plan-header">

        <h2>Your 7-Day Meal Plan</h2>

        <button
          class="new-plan-button"
          onclick="showSetup()"

          ← Change Preferences
        </button>

      </div>


      <div class="summary">

        <div class="summary-box">

          <div
            class="summary-number"
            id="summaryCalories"
          >
            —
          </div>

          <div class="summary-label">
            Target Calories
          </div>

        </div>


        <div class="summary-box">

          <div
            class="summary-number"
            id="summaryProtein"
          >
            —
          </div>

          <div class="summary-label">
            Avg. Protein
          </div>

        </div>


        <div class="summary-box">

          <div
            class="summary-number"
            id="summaryMeals"
          >
            21
          </div>

          <div class="summary-label">
            Meals
          </div>

        </div>

      </div>


      <div id="mealPlan"></div>


      <button
        class="grocery-button"
        onclick="showGroceryList()"
      >
        🛒 Build My Grocery List
      </button>

    </div>

  </section>


  <!-- RECIPE SCREEN -->

  <section id="recipeScreen" class="hidden">

    <div class="recipe-card">

      <button
        class="back-button"
        onclick="showPlan()"
      >
        ← Back to My Week
      </button>

      <div id="recipeContent"></div>

    </div>

  </section>


  <!-- GROCERY SCREEN -->

  <section id="groceryScreen" class="hidden">

    <div class="recipe-card">

      <button
        class="back-button"
        onclick="showPlan()"
      >
        ← Back to My Week
      </button>

      <h2>🛒 Your Grocery List</h2>

      <p class="recipe-description">
        Everything you need for your 7-day meal plan.
      </p>

      <div
        id="groceryList"
        class="grocery-list"
      ></div>

    </div>

  </section>

</div>

let currentPlan = [];
let currentRecipeIndex = null;


/*
 * GOAL SELECTION
 */

document.querySelectorAll(".goal-option").forEach(function(option) {

  option.addEventListener("click", function() {

    document.querySelectorAll(".goal-option").forEach(function(item) {
      item.classList.remove("selected");
    });

    option.classList.add("selected");

  });

});


/*
 * GENERATE PLAN
 */

function generatePlan() {

  const calories =
    Number(document.getElementById("calories").value);

  const likes =
    document.getElementById("likes").value.toLowerCase();

  const dislikes =
    document.getElementById("dislikes").value.toLowerCase();

  const difficulty =
    document.getElementById("difficulty").value;


  if (!calories) {

    alert("Please enter your daily calorie target.");

    return;
  }


  let scoredRecipes = recipes
    .filter(function(recipe) {

      const hasDislikedFood =
        recipe.tags.some(function(tag) {
          return dislikes.includes(tag);
        });

      return !hasDislikedFood;

    })
    .filter(function(recipe) {

      if (difficulty === "easy") {
        return recipe.difficulty === "easy";
      }

      if (difficulty === "moderate") {
        return recipe.difficulty !== "advanced";
      }

      return true;

    })
    .map(function(recipe) {

      let score = Math.random() * 2;

      recipe.tags.forEach(function(tag) {

        if (likes.includes(tag)) {
          score += 5;
        }

      });

      return {
        recipe: recipe,
        score: score
      };

    })
    .sort(function(a, b) {
      return b.score - a.score;
    });


  if (scoredRecipes.length < 6) {

    scoredRecipes = recipes.map(function(recipe) {

      return {
        recipe: recipe,
        score: Math.random()
      };

    });

  }


  scoredRecipes.sort(function() {
    return Math.random() - 0.5;
  });


  const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];


  currentPlan = [];


  days.forEach(function(day, dayIndex) {

    const breakfast =
      findMeal(scoredRecipes, "Breakfast", dayIndex);

    const lunch =
      findMeal(scoredRecipes, "Lunch", dayIndex + 3);

    const dinner =
      findMeal(scoredRecipes, "Dinner", dayIndex + 6);


    currentPlan.push({

      day: day,

      meals: [
        breakfast,
        lunch,
        dinner
      ]

    });

  });


  document.getElementById("summaryCalories").textContent =
    calories.toLocaleString();


  const averageProtein =
    Math.round(
      currentPlan.reduce(function(total, day) {

        return total +
          day.meals.reduce(function(dayTotal, meal) {
            return dayTotal + meal.protein;
          }, 0);

      }, 0) / 7
    );


  document.getElementById("summaryProtein").textContent =
    averageProtein + "g";


  renderPlan();

  showPlan();

}


/*
 * FIND MEAL
 */

function findMeal(scoredRecipes, mealType, offset) {

  let candidates =
    scoredRecipes.filter(function(item) {

      return item.recipe.type.includes(mealType);

    });


  if (candidates.length === 0) {
    candidates = scoredRecipes;
  }


  return candidates[offset % candidates.length].recipe;

}


/*
 * DISPLAY PLAN
 */

function renderPlan() {

  const container =
    document.getElementById("mealPlan");

  container.innerHTML = "";


  currentPlan.forEach(function(day, dayIndex) {

    const totalCalories =
      day.meals.reduce(function(total, meal) {
        return total + meal.calories;
      }, 0);


    const dayCard =
      document.createElement("div");

    dayCard.className = "day-card";


    let mealsHTML = "";


    day.meals.forEach(function(meal, mealIndex) {

      mealsHTML += `

        <div class="meal-row">

          <div>

            <div class="meal-type">
              ${meal.type}
            </div>

            <div class="meal-name">
              ${meal.name}
            </div>

            <div class="meal-info">
              ${meal.calories} calories •
              ${meal.protein}g protein
            </div>

          </div>

          <button
            class="meal-button"
            onclick="showRecipe(${dayIndex}, ${mealIndex})"
          >
            View
          </button>

        </div>

      `;

    });


    dayCard.innerHTML = `

      <div class="day-header">

        <div class="day-name">
          ${day.day}
        </div>

        <div class="day-calories">
          ${totalCalories} calories
        </div>

      </div>

      <div class="meal-list">
        ${mealsHTML}
      </div>

    `;


    container.appendChild(dayCard);

  });

}


/*
 * SHOW RECIPE
 */

function showRecipe(dayIndex, mealIndex) {

  currentRecipeIndex = {
    dayIndex: dayIndex,
    mealIndex: mealIndex
  };


  const meal =
    currentPlan[dayIndex].meals[mealIndex];


  const ingredientsHTML =
    meal.ingredients
      .map(function(item) {
        return `<li>${item}</li>`;
      })
      .join("");


  const instructionsHTML =
    meal.instructions
      .map(function(item) {
        return `<li>${item}</li>`;
      })
      .join("");


  document.getElementById("recipeContent").innerHTML = `

    <h1 class="recipe-title">
      ${meal.name}
    </h1>

    <p class="recipe-description">
      ${meal.description}
    </p>

    <div class="nutrition">

      <span>
        🔥 ${meal.calories} calories
      </span>

      <span>
        💪 ${meal.protein}g protein
      </span>

      <span>
        🍳 ${meal.difficulty}
      </span>

    </div>


    <div class="recipe-section">

      <h3>Ingredients</h3>

      <ul>
        ${ingredientsHTML}
      </ul>

    </div>


    <div class="recipe-section">

      <h3>Directions</h3>

      <ol>
        ${instructionsHTML}
      </ol>

    </div>


    <button
      class="replace-button"
      onclick="replaceCurrentMeal()"
    >
      🔄 Replace This Meal
    </button>

  `;


  showRecipeScreen();

}


/*
 * REPLACE MEAL
 */

function replaceCurrentMeal() {

  if (!currentRecipeIndex) {
    return;
  }


  const dayIndex =
    currentRecipeIndex.dayIndex;

  const mealIndex =
    currentRecipeIndex.mealIndex;


  const currentMeal =
    currentPlan[dayIndex].meals[mealIndex];


  let replacements =
    recipes.filter(function(recipe) {

      return recipe.id !== currentMeal.id;

    });


  const dislikes =
    document.getElementById("dislikes").value.toLowerCase();


  replacements =
    replacements.filter(function(recipe) {

      return !recipe.tags.some(function(tag) {
        return dislikes.includes(tag);
      });

    });


  const replacement =
    replacements[
      Math.floor(Math.random() * replacements.length)
    ];


  currentPlan[dayIndex].meals[mealIndex] =
    replacement;


  renderPlan();

  showRecipe(dayIndex, mealIndex);

}


/*
 * GROCERY LIST
 */

function showGroceryList() {

  const categories = {

    "Protein": [],

    "Produce": [],

    "Grains & Carbs": [],

    "Pantry & Other": []

  };


  currentPlan.forEach(function(day) {

    day.meals.forEach(function(meal) {

      meal.ingredients.forEach(function(ingredient) {

        const lower =
          ingredient.toLowerCase();


        if (
          lower.includes("chicken") ||
          lower.includes("steak") ||
          lower.includes("turkey") ||
          lower.includes("egg") ||
          lower.includes("yogurt")
        ) {

          categories["Protein"].push(ingredient);

        }

        else if (
          lower.includes("tomato") ||
          lower.includes("cucumber") ||
          lower.includes("broccoli") ||
          lower.includes("lettuce") ||
          lower.includes("spinach") ||
          lower.includes("pepper") ||
          lower.includes("onion") ||
          lower.includes("avocado") ||
          lower.includes("banana") ||
          lower.includes("berries") ||
          lower.includes("lemon") ||
          lower.includes("green beans")
        ) {

          categories["Produce"].push(ingredient);

        }

        else if (
          lower.includes("rice") ||
          lower.includes("potato") ||
          lower.includes("pasta") ||
          lower.includes("bread") ||
          lower.includes("oat") ||
          lower.includes("tortilla") ||
          lower.includes("granola")
        ) {

          categories["Grains & Carbs"].push(ingredient);

        }

        else {

          categories["Pantry & Other"].push(ingredient);

        }

      });

    });

  });


  let html = "";


  Object.keys(categories).forEach(function(category) {

    const uniqueItems =
      [...new Set(categories[category])];


    html += `

      <div class="grocery-category">

        <h3>${category}</h3>

        <ul>

          ${uniqueItems.map(function(item) {

            return `<li>${item}</li>`;

          }).join("")}

        </ul>

      </div>

    `;

  });


  document.getElementById("groceryList").innerHTML =
    html;


  showGroceryScreen();

}
