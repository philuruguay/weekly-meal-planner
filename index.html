<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meal Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f4;
      color: #1f2922;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 70px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 44px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 750;
    }

    .subtitle {
      margin-top: 8px;
      color: #68736b;
      font-size: 17px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 9px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8ded9;
      border-radius: 12px;
      font-size: 16px;
      background: white;
      color: #1f2922;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .goal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .goal-option {
      border: 1px solid #d8ded9;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
    }

    .goal-option.selected {
      border-color: #42634b;
      background: #edf4ee;
      font-weight: 650;
    }

    .generate-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: #42634b;
      color: white;
    }

    .generate-button:hover {
      background: #35523d;
    }

    .hidden {
      display: none;
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .plan-header h2 {
      margin: 0;
    }

    .new-plan-button,
    .meal-button {
      border: 1px solid #cbd5cd;
      background: white;
      color: #35523d;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-box {
      background: #edf4ee;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .summary-number {
      font-size: 23px;
      font-weight: 750;
    }

    .summary-label {
      color: #68736b;
      font-size: 13px;
      margin-top: 4px;
    }

    .day-card {
      border: 1px solid #e1e6e2;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
      background: white;
    }

    .day-header {
      padding: 16px 18px;
      background: #f1f5f1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-name {
      font-weight: 750;
      font-size: 18px;
    }

    .day-calories {
      color: #42634b;
      font-size: 14px;
      font-weight: 700;
    }

    .meal-list {
      padding: 6px 18px 14px;
    }

    .meal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0ed;
    }

    .meal-row:last-child {
      border-bottom: none;
    }

    .meal-type {
      color: #68736b;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .meal-name {
      font-weight: 700;
    }

    .meal-info {
      color: #68736b;
      font-size: 13px;
      margin-top: 3px;
    }

    .meal-button {
      flex-shrink: 0;
      padding: 8px 11px;
      font-size: 13px;
    }

    .recipe-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .back-button {
      border: none;
      background: none;
      color: #42634b;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
    }

    .recipe-title {
      margin: 0;
      font-size: 28px;
    }

    .recipe-description {
      color: #68736b;
      line-height: 1.5;
    }

    .nutrition {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .nutrition span {
      background: #edf4ee;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 650;
    }

    .recipe-section {
      margin-top: 22px;
    }

    .recipe-section ul,
    .recipe-section ol {
      line-height: 1.7;
      padding-left: 22px;
    }

    .replace-button,
    .grocery-button {
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
    }

    .replace-button {
      border: none;
      background: #42634b;
      color: white;
    }

    .grocery-button {
      border: 1px solid #42634b;
      background: white;
      color: #42634b;
    }

    .grocery-list {
      columns: 2;
      column-gap: 40px;
    }

    .grocery-category {
      break-inside: avoid;
      margin-bottom: 22px;
    }

    .grocery-category ul {
      padding-left: 20px;
      line-height: 1.7;
    }

    @media (max-width: 650px) {
      .app {
        padding: 22px 14px 50px;
      }

      h1 {
        font-size: 29px;
      }

      .goal-grid,
      .summary {
        grid-template-columns: 1fr;
      }

      .plan-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .grocery-list {
        columns: 1;
      }
    }
  </style>
</head>

<div class="app">

  <header class="header">
    <div class="logo">🥗</div>
    <h1>Weekly Meal Planner</h1>
    <div class="subtitle">
      Build a healthy week of meals that fits your life.
    </div>
  </header>


  <section id="setupScreen">

    <div class="card">

      <h2>Tell us about your week</h2>

      <div class="field">
        <label>Your goal</label>

        <div class="goal-grid">

          <div class="goal-option selected" data-goal="healthy">
            Eat Healthier
          </div>

          <div class="goal-option" data-goal="lose">
            Lose Weight
          </div>

          <div class="goal-option" data-goal="protein">
            High Protein
          </div>

          <div class="goal-option" data-goal="maintain">
            Maintain Weight
          </div>

        </div>
      </div>


      <div class="field">
        <label for="calories">Daily calorie target</label>

        <input
          type="number"
          id="calories"
          placeholder="Example: 1800"
          min="1000"
          max="5000"
        >
      </div>


      <div class="field">
        <label for="likes">Foods you like</label>

        <textarea
          id="likes"
          placeholder="Example: chicken, steak, potatoes, rice, Greek yogurt, eggs..."
        ></textarea>
      </div>


      <div class="field">
        <label for="dislikes">Foods you don't like</label>

        <textarea
          id="dislikes"
          placeholder="Example: fish, mushrooms, spicy food..."
        ></textarea>
      </div>


      <div class="field">
        <label for="difficulty">Cooking difficulty</label>

        <select id="difficulty">

          <option value="easy">
            Easy — quick and simple
          </option>

          <option value="moderate">
            Moderate — I don't mind cooking
          </option>

          <option value="advanced">
            Advanced — I enjoy cooking
          </option>

        </select>
      </div>


      <button
        class="generate-button"
        onclick="generatePlan()"
      >
        Generate My 7-Day Meal Plan
      </button>

    </div>

  </section>


  <section id="planScreen" class="hidden">

    <div class="card">

      <div class="plan-header">

        <h2>Your 7-Day Meal Plan</h2>

        <button
          class="new-plan-button"
          onclick="showSetup()"
        >
          ← Change Preferences
        </button>

      </div>


      <div class="summary">

        <div class="summary-box">
          <div class="summary-number" id="summaryCalories">—</div>
          <div class="summary-label">Target Calories</div>
        </div>

        <div class="summary-box">
          <div class="summary-number" id="summaryProtein">—</div>
          <div class="summary-label">Avg. Protein</div>
        </div>

        <div class="summary-box">
          <div class="summary-number">28</div>
          <div class="summary-label">Meals & Snacks</div>
        </div>

      </div>


      <div id="mealPlan"></div>


      <button
        class="grocery-button"
        onclick="showGroceryList()"
      >
        🛒 Build My Grocery List
      </button>

    </div>

  </section>


  <section id="recipeScreen" class="hidden">

    <div class="recipe-card">

      <button
        class="back-button"
        onclick="showPlan()"
      >
        ← Back to My Week
      </button>

      <div id="recipeContent"></div>

    </div>

  </section>


  <section id="groceryScreen" class="hidden">

    <div class="recipe-card">

      <button
        class="back-button"
        onclick="showPlan()"
      >
        ← Back to My Week
      </button>

      <h2>🛒 Your Grocery List</h2>

      <p class="recipe-description">
        Everything you need for your 7-day meal plan.
      </p>

      <div id="groceryList" class="grocery-list"></div>

    </div>

  </section>

</div>

let currentPlan = [];
let currentRecipeIndex = null;
let currentTargetCalories = 1800;


document.querySelectorAll(".goal-option").forEach(function(option) {

  option.addEventListener("click", function() {

    document.querySelectorAll(".goal-option").forEach(function(item) {
      item.classList.remove("selected");
    });

    option.classList.add("selected");

  });

});


function getSelectedGoal() {

  const selected =
    document.querySelector(".goal-option.selected");

  return selected ? selected.dataset.goal : "healthy";

}


function generatePlan() {

  const calories =
    Number(document.getElementById("calories").value);

  const likes =
    document.getElementById("likes").value.toLowerCase();

  const dislikes =
    document.getElementById("dislikes").value.toLowerCase();

  const difficulty =
    document.getElementById("difficulty").value;


  if (!calories) {

    alert("Please enter your daily calorie target.");

    return;
  }


  currentTargetCalories = calories;


  let availableRecipes =
    recipes.filter(function(recipe) {

      const disliked =
        recipe.tags.some(function(tag) {
          return dislikes.includes(tag);
        });

      if (disliked) {
        return false;
      }

      if (
        difficulty === "easy" &&
        recipe.difficulty !== "easy"
      ) {
        return false;
      }

      if (
        difficulty === "moderate" &&
        recipe.difficulty === "advanced"
      ) {
        return false;
      }

      return true;

    });


  if (availableRecipes.length < 8) {
    availableRecipes = recipes.slice();
  }


  currentPlan = [];


  const days = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];


  days.forEach(function(day, index) {

    const dayMeals =
      buildBestDay(
        availableRecipes,
        calories,
        likes,
        getSelectedGoal(),
        index
      );


    currentPlan.push({
      day: day,
      meals: dayMeals
    });

  });


  document.getElementById("summaryCalories").textContent =
    calories.toLocaleString();


  const averageProtein =
    Math.round(
      currentPlan.reduce(function(total, day) {

        return total +
          day.meals.reduce(function(dayTotal, meal) {
            return dayTotal + meal.protein;
          }, 0);

      }, 0) / 7
    );


  document.getElementById("summaryProtein").textContent =
    averageProtein + "g";


  renderPlan();

  showPlan();

}


function buildBestDay(
  availableRecipes,
  targetCalories,
  likes,
  goal,
  dayIndex
) {

  const breakfasts =
    availableRecipes.filter(function(recipe) {
      return recipe.type === "Breakfast";
    });


  const lunches =
    availableRecipes.filter(function(recipe) {
      return recipe.type === "Lunch";
    });


  const dinners =
    availableRecipes.filter(function(recipe) {
      return recipe.type === "Dinner";
    });


  const snacks =
    availableRecipes.filter(function(recipe) {
      return recipe.type === "Snack";
    });


  const breakfastList =
    breakfasts.length ? breakfasts : recipes.filter(r => r.type === "Breakfast");

  const lunchList =
    lunches.length ? lunches : recipes.filter(r => r.type === "Lunch");

  const dinnerList =
    dinners.length ? dinners : recipes.filter(r => r.type === "Dinner");

  const snackList =
    snacks.length ? snacks : recipes.filter(r => r.type === "Snack");


  let bestCombination = null;
  let bestScore = Infinity;


  for (let b = 0; b < breakfastList.length; b++) {

    for (let l = 0; l < lunchList.length; l++) {

      for (let d = 0; d < dinnerList.length; d++) {

        for (let s = 0; s < snackList.length; s++) {

          const breakfast = breakfastList[b];
          const lunch = lunchList[l];
          const dinner = dinnerList[d];
          const snack = snackList[s];


          const totalCalories =
            breakfast.calories +
            lunch.calories +
            dinner.calories +
            snack.calories;


          const totalProtein =
            breakfast.protein +
            lunch.protein +
            dinner.protein +
            snack.protein;


          let score =
            Math.abs(totalCalories - targetCalories);


          /*
           * Reward foods the user said they like.
           */

          const chosenMeals = [
            breakfast,
            lunch,
            dinner,
            snack
          ];


          chosenMeals.forEach(function(meal) {

            meal.tags.forEach(function(tag) {

              if (likes.includes(tag)) {
                score -= 15;
              }

            });

          });


          /*
           * High-protein goals favor more protein.
           */

          if (goal === "protein") {

            score -= totalProtein * 2;

          }


          /*
           * Avoid repeating the exact same meal
           * too aggressively across the week.
           */

          if (dayIndex > 0) {

            const previousDay =
              currentPlan[dayIndex - 1];


            if (previousDay) {

              previousDay.meals.forEach(function(previousMeal) {

                chosenMeals.forEach(function(meal) {

                  if (meal.id === previousMeal.id) {
                    score += 25;
                  }

                });

              });

            }

          }


          if (score < bestScore) {

            bestScore = score;

            bestCombination = [
              breakfast,
              lunch,
              dinner,
              snack
            ];

          }

        }

      }

    }

  }


  return bestCombination;

}


function renderPlan() {

  const container =
    document.getElementById("mealPlan");

  container.innerHTML = "";


  currentPlan.forEach(function(day, dayIndex) {

    const totalCalories =
      day.meals.reduce(function(total, meal) {
        return total + meal.calories;
      }, 0);


    const totalProtein =
      day.meals.reduce(function(total, meal) {
        return total + meal.protein;
      }, 0);


    const difference =
      totalCalories - currentTargetCalories;


    const differenceText =
      difference === 0
        ? "On target"
        : difference > 0
          ? `+${difference} calories`
          : `${difference} calories`;


    const dayCard =
      document.createElement("div");

    dayCard.className = "day-card";


    let mealsHTML = "";


    day.meals.forEach(function(meal, mealIndex) {

      mealsHTML += `

        <div class="meal-row">

          <div>

            <div class="meal-type">
              ${meal.type}
            </div>

            <div class="meal-name">
              ${meal.name}
            </div>

            <div class="meal-info">
              ${meal.calories} calories •
              ${meal.protein}g protein
            </div>

          </div>

          <button
            class="meal-button"
            onclick="showRecipe(${dayIndex}, ${mealIndex})"
          >
            View
          </button>

        </div>

      `;

    });


    dayCard.innerHTML = `

      <div class="day-header">

        <div>

          <div class="day-name">
            ${day.day}
          </div>

          <div class="day-calories">
            ${totalCalories} calories •
            ${totalProtein}g protein
          </div>

        </div>

        <div class="day-calories">
          ${differenceText}
        </div>

      </div>

      <div class="meal-list">
        ${mealsHTML}
      </div>

    `;


    container.appendChild(dayCard);

  });

}


function showRecipe(dayIndex, mealIndex) {

  currentRecipeIndex = {
    dayIndex: dayIndex,
    mealIndex: mealIndex
  };


  const meal =
    currentPlan[dayIndex].meals[mealIndex];


  const ingredientsHTML =
    meal.ingredients
      .map(function(item) {
        return `<li>${item}</li>`;
      })
      .join("");


  const instructionsHTML =
    meal.instructions
      .map(function(item) {
        return `<li>${item}</li>`;
      })
      .join("");


  document.getElementById("recipeContent").innerHTML = `

    <h1 class="recipe-title">
      ${meal.name}
    </h1>

    <p class="recipe-description">
      ${meal.description}
    </p>

    <div class="nutrition">

      <span>
        🔥 ${meal.calories} calories
      </span>

      <span>
        💪 ${meal.protein}g protein
      </span>

      <span>
        🍳 ${meal.difficulty}
      </span>

    </div>


    <div class="recipe-section">

      <h3>Ingredients</h3>

      <ul>
        ${ingredientsHTML}
      </ul>

    </div>


    <div class="recipe-section">

      <h3>Directions</h3>

      <ol>
        ${instructionsHTML}
      </ol>

    </div>


    <button
      class="replace-button"
      onclick="replaceCurrentMeal()"
    >
      🔄 Replace This Meal
    </button>

  `;


  showRecipeScreen();

}


function replaceCurrentMeal() {

  if (!currentRecipeIndex) {
    return;
  }


  const dayIndex =
    currentRecipeIndex.dayIndex;

  const mealIndex =
    currentRecipeIndex.mealIndex;


  const currentMeal =
    currentPlan[dayIndex].meals[mealIndex];


  const mealType =
    currentMeal.type;


  const dislikes =
    document.getElementById("dislikes").value.toLowerCase();


  let replacements =
    recipes.filter(function(recipe) {

      if (recipe.id === currentMeal.id) {
        return false;
      }

      if (recipe.type !== mealType) {
        return false;
      }

      return !recipe.tags.some(function(tag) {
        return dislikes.includes(tag);
      });

    });


  if (!replacements.length) {
    replacements =
      recipes.filter(function(recipe) {
        return recipe.type === mealType &&
          recipe.id !== currentMeal.id;
      });
  }


  const replacement =
    replacements[
      Math.floor(Math.random() * replacements.length)
    ];


  currentPlan[dayIndex].meals[mealIndex] =
    replacement;


  renderPlan();

  showRecipe(dayIndex, mealIndex);

}


function showGroceryList() {

  const categories = {

    "Protein": [],
    "Produce": [],
    "Grains & Carbs": [],
    "Pantry & Other": []

  };


  currentPlan.forEach(function(day) {

    day.meals.forEach(function(meal) {

      meal.ingredients.forEach(function(ingredient) {

        const lower =
          ingredient.toLowerCase();


        if (
          lower.includes("chicken") ||
          lower.includes("steak") ||
          lower.includes("turkey") ||
          lower.includes("egg") ||
          lower.includes("yogurt")
        ) {

          categories["Protein"].push(ingredient);

        }

        else if (
          lower.includes("tomato") ||
          lower.includes("cucumber") ||
          lower.includes("broccoli") ||
          lower.includes("lettuce") ||
          lower.includes("spinach") ||
          lower.includes("pepper") ||
          lower.includes("onion") ||
          lower.includes("avocado") ||
          lower.includes("banana") ||
          lower.includes("berries") ||
          lower.includes("lemon") ||
          lower.includes("green beans") ||
          lower.includes("apple")
        ) {

          categories["Produce"].push(ingredient);

        }

        else if (
          lower.includes("rice") ||
          lower.includes("potato") ||
          lower.includes("pasta") ||
          lower.includes("bread") ||
          lower.includes("oat") ||
          lower.includes("tortilla") ||
          lower.includes("granola")
        ) {

          categories["Grains & Carbs"].push(ingredient);

        }

        else {

          categories["Pantry & Other"].push(ingredient);

        }

      });

    });

  });


  let html = "";


  Object.keys(categories).forEach(function(category) {

    const uniqueItems =
      [...new Set(categories[category])];


    html += `

      <div class="grocery-category">

        <h3>${category}</h3>

        <ul>

          ${uniqueItems.map(function(item) {
            return `<li>${item}</li>`;
          }).join("")}

        </ul>

      </div>

    `;

  });


  document.getElementById("groceryList").innerHTML =
    html;


  showGroceryScreen();

}
